<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1411" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💵</text></svg>" />
    <title>Tr-ACES</title>
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        var sizes = { small: 0.9, large: 1.15, xlarge: 1.3 }
        var z = sizes[localStorage.getItem('textSize')]
        if (z) document.documentElement.style.setProperty('--text-scale', z)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="bg-fx" aria-hidden="true"><span></span><span></span><span></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
